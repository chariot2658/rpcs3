name: Windows x64 build

on:
  push:
    branches:
      - t500rs
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  BUILD_REPOSITORY_NAME: ${{ github.repository }}
  BUILD_SOURCEBRANCHNAME: ${{ github.ref_name }}
  BUILD_PR_NUMBER: ${{ github.event.pull_request.number }}
  BUILD_SOURCEVERSION: ${{ github.sha }}
  BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ github.workspace }}/artifacts/

jobs:
  # Rebase t500rs onto upstream master only when new commits are pushed; there
  # is no scheduled rebase. If a rebase is pushed, the build runs on that new
  # head instead of here. On conflicts the pushed commit is built unrebased.
  rebase:
    name: Rebase t500rs onto upstream
    if: github.event_name == 'push' && github.repository == 'chariot2658/rpcs3'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
    env:
      HAS_REBASE_TOKEN: ${{ secrets.REBASE_TOKEN != '' }}
    outputs:
      rebased: ${{ steps.rebase.outputs.rebased }}

    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          # GITHUB_TOKEN can never push commits that touch .github/workflows/,
          # which upstream rebases regularly do. REBASE_TOKEN must be a PAT with
          # Contents + Workflows write access to this repository.
          token: ${{ secrets.REBASE_TOKEN || github.token }}

      - name: Rebase onto RPCS3 master
        id: rebase
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/RPCS3/rpcs3.git
          git fetch --no-tags upstream master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo 'rebased=false' >> "$GITHUB_OUTPUT"
            echo 't500rs is already based on the latest upstream master.'
            exit 0
          fi

          if ! git rebase upstream/master; then
            git rebase --abort
            echo 'rebased=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Rebase onto upstream master conflicted; building the pushed commit unrebased.'
            exit 0
          fi

          git push origin HEAD:refs/heads/t500rs \
            --force-with-lease="refs/heads/t500rs:${GITHUB_SHA}"
          echo 'rebased=true' >> "$GITHUB_OUTPUT"

      # A push made with REBASE_TOKEN starts this workflow again for the rebased
      # head. A push made with GITHUB_TOKEN does not, so dispatch the build.
      - name: Trigger Windows x64 build
        if: steps.rebase.outputs.rebased == 'true' && env.HAS_REBASE_TOKEN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run windows-x64.yml --repo "$GITHUB_REPOSITORY" --ref t500rs

  windows_x64:
    name: RPCS3 Windows x64 Release
    needs: rebase
    # Runs for dispatches, PRs and pushes that needed no rebase. A pushed
    # rebase is built by the run it starts.
    if: ${{ !cancelled() && needs.rebase.outputs.rebased != 'true' }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 360
    env:
      COMPILER: msvc
      QT_VER_MAIN: '6'
      QT_VER: '6.11.2'
      QT_VER_MSVC: 'msvc2022'
      QT_DATE: '202608131017'
      LLVM_VER: '22.1.8'
      VULKAN_VER: '1.4.341.1'
      VULKAN_SDK_SHA: 'bcf2d75aa9556889ab974858666e20b3655b6055a0db704ccb47279ff33b5bfe'
      CCACHE_SHA: '859141059ac950e1e8cd042c66f842f26b9e3a62a1669a69fe6ba180cb58bbdf'
      CCACHE_BIN_DIR: 'C:\ccache_bin'
      CCACHE_DIR: 'C:\ccache'
      CCACHE_INODECACHE: 'true'
      CCACHE_SLOPPINESS: 'time_macros'
      CCACHE_MAXSIZE: '7G'
      DEPS_CACHE_DIR: ./dependency_cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Setup NuGet
        uses: nuget/setup-nuget@v4

      - name: Restore NuGet packages
        run: nuget restore rpcs3.sln

      - name: Set dependency paths
        shell: pwsh
        run: |
          echo "QTDIR=C:\Qt\${{ env.QT_VER }}\${{ env.QT_VER_MSVC }}_64" >> $env:GITHUB_ENV
          echo "VULKAN_SDK=C:\VulkanSDK\${{ env.VULKAN_VER }}" >> $env:GITHUB_ENV

      - name: Get cache keys
        run: .ci/get_keys-windows.sh

      - name: Restore compiler cache
        uses: actions/cache/restore@main
        id: restore-build-ccache
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ env.COMPILER }}-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-ccache-${{ env.COMPILER }}-

      - name: Restore dependencies cache
        uses: actions/cache/restore@main
        id: restore-dependencies-cache
        with:
          path: ${{ env.DEPS_CACHE_DIR }}
          key: ${{ runner.os }}-${{ env.COMPILER }}-${{ env.QT_VER }}-${{ env.VULKAN_SDK_SHA }}-${{ env.CCACHE_SHA }}-${{ hashFiles('llvm.lock') }}
          restore-keys: ${{ runner.os }}-${{ env.COMPILER }}-

      - name: Download and unpack dependencies
        run: |
          .ci/setup-windows.sh
          .ci/setup-windows-ci-vars.sh win64 msvc

      - name: Export build variables
        run: |
          while IFS='=' read -r key val; do
            [[ -z "$key" || "$key" =~ ^# ]] && continue
            echo "$key=$val" >> "$GITHUB_ENV"
          done < .ci/ci-vars.env

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@main

      - name: Compile RPCS3
        shell: pwsh
        run: >-
          msbuild rpcs3.sln
          /p:Configuration=Release
          /p:Platform=x64
          /p:PreferredToolArchitecture=x64
          /p:CLToolPath=${{ env.CCACHE_BIN_DIR }}
          /p:UseMultiToolTask=true
          /p:CustomAfterMicrosoftCommonTargets="${{ github.workspace }}\buildfiles\msvc\ci_only.targets"
          /v:minimal

      - name: Run unit tests
        shell: pwsh
        run: build\lib\Release-x64\rpcs3_test.exe

      - name: Package build artifacts
        run: |
          mkdir -p "$BUILD_ARTIFACTSTAGINGDIRECTORY"
          .ci/deploy-windows.sh

      - name: Upload Windows x64 build
        uses: actions/upload-artifact@main
        with:
          name: RPCS3-Windows-x64-${{ github.sha }}
          path: ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}
          compression-level: 0
          if-no-files-found: error

      - name: Save compiler cache
        if: success()
        uses: actions/cache/save@main
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.restore-build-ccache.outputs.cache-primary-key }}

      - name: Save dependencies cache
        if: success() && steps.restore-dependencies-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@main
        with:
          path: ${{ env.DEPS_CACHE_DIR }}
          key: ${{ steps.restore-dependencies-cache.outputs.cache-primary-key }}
